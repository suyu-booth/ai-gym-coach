[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-gym-coach"
version = "1.0.0"
description = "AI Gym Coach — workout planner with Notion sync and progressive overload"
requires-python = ">=3.10"
dependencies = [
    "notion-client>=2.7.0",
    "typer[all]>=0.15.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "python-dateutil>=2.9",
    "python-crontab>=3.0",
]

[project.scripts]
coach = "gym_coach.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
